name: Validate skills
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  DO_NOT_TRACK: '1'
  DISABLE_TELEMETRY: '1'
  MEGADEV_REQUIRE_HOST_CC: '1'
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m unittest discover -s tests -v
  distribution:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: python -m pip install -r tests/requirements.txt
      - run: python tests/distribution.py
  target:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            skill: megadev-project
          - arch: amd64
            runner: ubuntu-24.04
            skill: megadev-project
          - arch: arm64
            runner: ubuntu-24.04-arm
            skill: megadev-hardware
          - arch: amd64
            runner: ubuntu-24.04
            skill: megadev-hardware
          - arch: arm64
            runner: ubuntu-24.04-arm
            skill: megadev-assets
          - arch: amd64
            runner: ubuntu-24.04
            skill: megadev-assets
          - arch: arm64
            runner: ubuntu-24.04-arm
            skill: megadev-graphics
          - arch: amd64
            runner: ubuntu-24.04
            skill: megadev-graphics
          - arch: arm64
            runner: ubuntu-24.04-arm
            skill: megadev-input
          - arch: amd64
            runner: ubuntu-24.04
            skill: megadev-input
          - arch: arm64
            runner: ubuntu-24.04-arm
            skill: megadev-system
          - arch: amd64
            runner: ubuntu-24.04
            skill: megadev-system
          - arch: arm64
            runner: ubuntu-24.04-arm
            skill: megadev-memory
          - arch: amd64
            runner: ubuntu-24.04
            skill: megadev-memory
          - arch: arm64
            runner: ubuntu-24.04-arm
            skill: megadev-streaming
          - arch: amd64
            runner: ubuntu-24.04
            skill: megadev-streaming
          - arch: arm64
            runner: ubuntu-24.04-arm
            skill: megadev-audio
          - arch: amd64
            runner: ubuntu-24.04
            skill: megadev-audio
          - arch: arm64
            runner: ubuntu-24.04-arm
            skill: megadev-scenes
          - arch: amd64
            runner: ubuntu-24.04
            skill: megadev-scenes
          - arch: arm64
            runner: ubuntu-24.04-arm
            skill: megadev-save
          - arch: amd64
            runner: ubuntu-24.04
            skill: megadev-save
          - arch: arm64
            runner: ubuntu-24.04-arm
            skill: megadev-scaling
          - arch: amd64
            runner: ubuntu-24.04
            skill: megadev-scaling
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: docker pull --platform linux/${{ matrix.arch }} ewrogers/megadev:latest
      - run: python tests/integration.py --skill ${{ matrix.skill }} --platform linux/${{ matrix.arch }} --output build/target
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: target-${{ matrix.skill }}-${{ matrix.arch }}
          path: |
            build/target/report.json
            build/target/*.log
          if-no-files-found: error
  compare:
    needs: target
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: target-*
          path: build/reports
      - run: python tests/compare_reports.py build/reports/target-megadev-project-arm64/report.json build/reports/target-megadev-project-amd64/report.json
      - run: python tests/compare_reports.py build/reports/target-megadev-hardware-arm64/report.json build/reports/target-megadev-hardware-amd64/report.json
      - run: python tests/compare_reports.py build/reports/target-megadev-assets-arm64/report.json build/reports/target-megadev-assets-amd64/report.json
      - run: python tests/compare_reports.py build/reports/target-megadev-graphics-arm64/report.json build/reports/target-megadev-graphics-amd64/report.json
      - run: python tests/compare_reports.py build/reports/target-megadev-input-arm64/report.json build/reports/target-megadev-input-amd64/report.json
      - run: python tests/compare_reports.py build/reports/target-megadev-system-arm64/report.json build/reports/target-megadev-system-amd64/report.json
      - run: python tests/compare_reports.py build/reports/target-megadev-memory-arm64/report.json build/reports/target-megadev-memory-amd64/report.json
      - run: python tests/compare_reports.py build/reports/target-megadev-streaming-arm64/report.json build/reports/target-megadev-streaming-amd64/report.json
      - run: python tests/compare_reports.py build/reports/target-megadev-audio-arm64/report.json build/reports/target-megadev-audio-amd64/report.json
      - run: python tests/compare_reports.py build/reports/target-megadev-scenes-arm64/report.json build/reports/target-megadev-scenes-amd64/report.json
      - run: python tests/compare_reports.py build/reports/target-megadev-save-arm64/report.json build/reports/target-megadev-save-amd64/report.json
      - run: python tests/compare_reports.py build/reports/target-megadev-scaling-arm64/report.json build/reports/target-megadev-scaling-amd64/report.json
